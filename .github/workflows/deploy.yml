name: Deploy to EC2

on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # Usa Node 22 (requerido por Prisma 7). Instala si no existe
            if ! nvm ls 22 >/dev/null 2>&1; then
              echo "Instalando Node 22..."
              nvm install 22
            fi
            nvm use 22
            nvm alias default 22
            for d in $HOME/.nvm/versions/node/*/bin; do [ -d "$d" ] && export PATH="$d:$PATH"; done
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"
            echo "node: $(which node || echo 'not found') $(node -v || echo 'no version')"
            echo "npm: $(which npm || echo 'not found') $(npm -v || echo 'no version')"
            echo "pm2: $(which pm2 || echo 'not found')"
            if [ ! -d /home/ubuntu/proyects/gestordegastos/.git ]; then
              echo "Clonando por primera vez..."
              mkdir -p /home/ubuntu/proyects
              git clone https://github.com/dennisbc24/gestordegastos.git /home/ubuntu/proyects/gestordegastos
            fi
            cd /home/ubuntu/proyects/gestordegastos
            git pull origin master
            npm ci --prefer-offline --no-audit
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart gestordegastos || pm2 start npm --name "gestordegastos" -- start -- --port 3087
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
            echo "Deploy OK: $(date)"
