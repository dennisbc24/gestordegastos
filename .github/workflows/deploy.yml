name: Deploy to EC2

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --prefer-offline --no-audit

      - name: Prisma generate
        run: npx prisma generate

      - name: Build Next.js (en GitHub, no en EC2)
        run: npm run build
        env:
          # Evita que el build intente conectar a la BD real
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?schema=public
          JWT_SECRET: dummy-build-secret

      - name: Create deploy archive
        run: |
          tar -czf gestordegastos.tar.gz --ignore-failed-read \
            --exclude='.git' --exclude='node_modules' --exclude='.next/cache' \
            .next prisma package.json package-lock.json public src next.config.ts prisma.config.ts postcss.config.mjs tsconfig.json || \
          tar -czf gestordegastos.tar.gz --ignore-failed-read \
            --exclude='.git' --exclude='node_modules' \
            .next prisma package.json package-lock.json public src next.config.ts prisma.config.ts || true
          ls -lh gestordegastos.tar.gz

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "gestordegastos.tar.gz"
          target: "/tmp/"
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22 || nvm install 22 && nvm use 22
            nvm alias default 22
            for d in $HOME/.nvm/versions/node/*/bin; do [ -d "$d" ] && export PATH="$d:$PATH"; done

            # Clonar si no existe
            if [ ! -d /home/ubuntu/proyects/gestordegastos/.git ]; then
              mkdir -p /home/ubuntu/proyects
              git clone https://github.com/dennisbc24/gestordegastos.git /home/ubuntu/proyects/gestordegastos
            fi
            cd /home/ubuntu/proyects/gestordegastos
            git pull origin master

            # Descomprimir lo compilado en GitHub (sobrescribe .next y prisma)
            # el scp lo deja en /tmp/gestordegastos.tar.gz o /tmp/./gestordegastos.tar.gz según versión
            if [ -f /tmp/gestordegastos.tar.gz ]; then
              tar -xzf /tmp/gestordegastos.tar.gz -C /home/ubuntu/proyects/gestordegastos
              rm /tmp/gestordegastos.tar.gz
            elif [ -f /tmp/./gestordegastos.tar.gz ]; then
              tar -xzf /tmp/./gestordegastos.tar.gz -C /home/ubuntu/proyects/gestordegastos
              rm /tmp/./gestordegastos.tar.gz
            else
              echo "Buscando tar..."
              find /tmp -name "gestordegastos.tar.gz" -exec tar -xzf {} -C /home/ubuntu/proyects/gestordegastos \; -exec rm {} \;
            fi

            # Solo instala deps de producción + prisma (sin compilar)
            npm ci --omit=dev --prefer-offline --no-audit || npm ci --prefer-offline --no-audit
            npx prisma generate
            npx prisma migrate deploy

            pm2 restart gestordegastos || pm2 start npm --name "gestordegastos" -- start -- --port 3087
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
            echo "Deploy OK (build en GitHub): $(date)"
